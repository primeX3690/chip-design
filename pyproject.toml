[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evohdl"
version = "0.2.0"
description = "Search-based RTL optimization experiments on top of the open-source Yosys/Verilator/OpenLane flow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "psutil>=5.9", "numpy>=1.24"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "plotly>=5.20", "pandas>=2.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["evohdl*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
